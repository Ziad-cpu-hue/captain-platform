workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter pub get

      - name: Regenerate Android folder
        script: |
          cd flutter_app
          rm -rf android
          flutter create --platforms android .
          sed -i 's/com.example.flutter_app/eg.captain.app/g' android/app/build.gradle
          sed -i 's/com.example.flutter_app/eg.captain.app/g' android/app/src/main/AndroidManifest.xml
          echo '{"project_info":{"project_number":"000000000000","project_id":"captain-app","storage_bucket":"captain-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"eg.captain.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle
          sed -i 's/dependencies {/dependencies {\n    implementation platform("com.google.firebase:firebase-bom:32.7.0")/' android/app/build.gradle

      - name: Build APK
        script: |
          cd flutter_app
          flutter build apk --debug --no-tree-shake-icons

    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/app-debug.apk
