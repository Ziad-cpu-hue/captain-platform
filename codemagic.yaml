workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter pub get

      - name: Regenerate Android folder
        script: |
          cd flutter_app
          rm -rf android
          flutter create --platforms android .

          python3 -c "
          # Fix package name
          b = open('android/app/build.gradle').read()
          b = b.replace('com.example.flutter_app', 'eg.captain.app')
          open('android/app/build.gradle', 'w').write(b)

          m = open('android/app/src/main/AndroidManifest.xml').read()
          m = m.replace('com.example.flutter_app', 'eg.captain.app')
          open('android/app/src/main/AndroidManifest.xml', 'w').write(m)

          # Add google-services to settings.gradle
          s = open('android/settings.gradle').read()
          s = s.replace(
              'id \"com.android.application\" version',
              'id \"com.google.gms.google-services\" version \"4.4.0\" apply false\n    id \"com.android.application\" version'
          )
          open('android/settings.gradle', 'w').write(s)

          # Add google-services plugin to app/build.gradle
          b = open('android/app/build.gradle').read()
          b = b.replace(
              'id \"dev.flutter.flutter-gradle-plugin\"',
              'id \"dev.flutter.flutter-gradle-plugin\"\n    id \"com.google.gms.google-services\"'
          )
          open('android/app/build.gradle', 'w').write(b)
          print('Done')
          "

          # google-services.json placeholder
          echo '{"project_info":{"project_number":"000000000000","project_id":"captain-app","storage_bucket":"captain-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"eg.captain.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json

          # Gradle wrapper for Java 17
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-all.zip\n' > android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch geolocator plugin
        script: |
          # Find and patch geolocator_android build.gradle directly
          GEOLOCATOR_GRADLE=$(find $HOME/.pub-cache -name "build.gradle" -path "*/geolocator_android*" 2>/dev/null | head -1)
          if [ -n "$GEOLOCATOR_GRADLE" ]; then
            echo "Found: $GEOLOCATOR_GRADLE"
            python3 -c "
          import sys
          path = '$GEOLOCATOR_GRADLE'
          content = open(path).read()
          print('BEFORE:')
          print(content[content.find('compileSdkVersion')-20:content.find('compileSdkVersion')+50] if 'compileSdkVersion' in content else 'not found')
          # Replace flutter.compileSdkVersion with hard number
          content = content.replace('flutter.compileSdkVersion', '35')
          content = content.replace('flutter.minSdkVersion', '21')
          content = content.replace('flutter.targetSdkVersion', '35')
          open(path, 'w').write(content)
          print('PATCHED successfully')
            "
          else
            echo "geolocator not found in pub-cache yet, running pub get first"
            cd flutter_app && flutter pub get
            GEOLOCATOR_GRADLE=$(find $HOME/.pub-cache -name "build.gradle" -path "*/geolocator_android*" 2>/dev/null | head -1)
            echo "Found after pub get: $GEOLOCATOR_GRADLE"
            python3 -c "
          path = '$GEOLOCATOR_GRADLE'
          content = open(path).read()
          content = content.replace('flutter.compileSdkVersion', '35')
          content = content.replace('flutter.minSdkVersion', '21')
          content = content.replace('flutter.targetSdkVersion', '35')
          open(path, 'w').write(content)
          print('PATCHED')
            "
          fi

      - name: Build APK
        script: |
          cd flutter_app
          flutter build apk --debug --no-tree-shake-icons

    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/app-debug.apk
